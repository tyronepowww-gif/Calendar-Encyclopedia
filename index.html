<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta
    name="description"
    content="Lunar Wisdom: a local-first lunar calendar, seasonal reflection, virtues, sourced wisdom, and a private journal."
  />
  <title>Lunar Wisdom</title>

  <style>
    :root {
      --bg: #07101e;
      --bg-deep: #030813;
      --panel: rgba(17, 31, 52, 0.88);
      --panel-soft: rgba(29, 48, 75, 0.64);
      --panel-hover: rgba(43, 67, 100, 0.78);
      --line: rgba(211, 228, 255, 0.14);
      --text: #edf5ff;
      --muted: #afbed2;
      --faint: #7d8da6;
      --accent: #b9d7ff;
      --gold: #efc875;
      --spring: #8ed69f;
      --summer: #ffd56d;
      --autumn: #e99c64;
      --winter: #9ed7f2;
      --danger: #ff8d97;
      --success: #9ee0b2;
      --shadow: 0 14px 35px rgba(0, 0, 0, 0.28);
      --radius: 18px;
      --nav-height: 76px;
      --max-width: 1120px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle at 14% 12%, rgba(69, 111, 167, 0.2), transparent 23rem),
        radial-gradient(circle at 92% 8%, rgba(146, 108, 186, 0.13), transparent 22rem),
        linear-gradient(180deg, var(--bg), var(--bg-deep));
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.22) 0 1px, transparent 1.5px),
        radial-gradient(circle at 84% 10%, rgba(255, 255, 255, 0.18) 0 1px, transparent 1.5px),
        radial-gradient(circle at 70% 45%, rgba(255, 255, 255, 0.13) 0 1px, transparent 1.5px),
        radial-gradient(circle at 27% 68%, rgba(255, 255, 255, 0.12) 0 1px, transparent 1.5px);
      background-size: 180px 180px, 230px 230px, 270px 270px, 340px 340px;
      overflow-x: hidden;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(185, 215, 255, 0.9);
      outline-offset: 3px;
    }

    a {
      color: #c8e0ff;
    }

    strong {
      color: #f5f9ff;
    }

    .app-shell {
      width: min(100%, var(--max-width));
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 14px calc(var(--nav-height) + env(safe-area-inset-bottom) + 22px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: #ffefa9;
      background:
        radial-gradient(circle at 35% 32%, #fff8cb 0 17%, #cdd8e8 18% 48%, #768498 49% 100%);
      box-shadow: 0 0 22px rgba(219, 232, 255, 0.18);
      font-size: 1.25rem;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.06rem;
      letter-spacing: 0.03em;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .icon-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(18, 33, 55, 0.72);
      font-size: 1.1rem;
    }

    .desktop-nav {
      display: none;
    }

    .screen {
      display: none;
      animation: fadeIn 180ms ease-out;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 12px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -0.025em;
    }

    .section-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .card {
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(150deg, rgba(28, 46, 73, 0.9), rgba(12, 24, 42, 0.9));
      box-shadow: var(--shadow);
    }

    .card.soft {
      background: var(--panel-soft);
      box-shadow: none;
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      padding: 19px;
      background:
        radial-gradient(circle at 82% 12%, rgba(255, 239, 169, 0.2), transparent 8rem),
        linear-gradient(145deg, rgba(33, 54, 87, 0.96), rgba(9, 19, 34, 0.95));
    }

    .hero-card::after {
      position: absolute;
      top: -50px;
      right: -55px;
      width: 190px;
      height: 190px;
      border: 1px solid rgba(233, 245, 255, 0.16);
      border-radius: 50%;
      content: "";
    }

    .moon-hero {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .moon-glyph {
      display: grid;
      width: 84px;
      height: 84px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(229, 240, 255, 0.2);
      border-radius: 50%;
      background: rgba(4, 11, 22, 0.35);
      box-shadow:
        inset -10px -10px 20px rgba(0, 0, 0, 0.18),
        0 0 28px rgba(219, 232, 255, 0.12);
      font-size: 3.9rem;
      line-height: 1;
    }

    .moon-title {
      margin: 0;
      font-size: clamp(1.3rem, 5vw, 1.72rem);
      letter-spacing: -0.03em;
    }

    .moon-date {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 17px;
    }

    .stat {
      padding: 10px;
      border: 1px solid rgba(224, 237, 255, 0.11);
      border-radius: 12px;
      background: rgba(3, 12, 25, 0.28);
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 0.69rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .stat-value {
      display: block;
      margin-top: 3px;
      font-size: 1rem;
      font-weight: 720;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 13px 0 16px;
    }

    .button {
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(42, 68, 102, 0.78);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 700;
      transition: transform 140ms ease, background 140ms ease;
    }

    .button:hover {
      background: rgba(65, 95, 136, 0.9);
      transform: translateY(-1px);
    }

    .button.secondary {
      background: rgba(17, 30, 50, 0.77);
    }

    .button.ghost {
      background: transparent;
    }

    .button.danger {
      border-color: rgba(255, 141, 151, 0.34);
      color: #ffd7da;
      background: rgba(130, 37, 50, 0.3);
    }

    .button.full {
      width: 100%;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
      padding: 5px 9px;
      border: 1px solid rgba(205, 226, 255, 0.17);
      border-radius: 999px;
      background: rgba(185, 215, 255, 0.1);
      color: #dcecff;
      font-size: 0.72rem;
      font-weight: 750;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .two-column {
      display: grid;
      gap: 14px;
    }

    .theme-large {
      margin: 2px 0 7px;
      color: #fff6cd;
      font-size: 1.6rem;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .theme-copy,
    .body-copy {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.92rem;
    }

    .season-card {
      border-left: 4px solid var(--season-color, var(--accent));
    }

    .season-name {
      margin: 0;
      color: var(--season-color, var(--accent));
      font-size: 1.35rem;
    }

    .progress-track {
      height: 9px;
      margin-top: 13px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.27);
    }

    .progress-fill {
      width: var(--progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        var(--season-color, var(--accent)),
        rgba(255, 255, 255, 0.8)
      );
      box-shadow: 0 0 14px var(--season-color, var(--accent));
    }

    .quote-card {
      border-color: rgba(236, 205, 122, 0.2);
      background:
        linear-gradient(145deg, rgba(62, 51, 38, 0.76), rgba(18, 27, 41, 0.93));
    }

    blockquote {
      margin: 10px 0;
      padding: 0 0 0 13px;
      border-left: 3px solid var(--gold);
      color: #fff7df;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .source-meta {
      color: var(--muted);
      font-size: 0.79rem;
      line-height: 1.5;
    }

    details {
      margin-top: 13px;
      border-top: 1px solid var(--line);
    }

    summary {
      padding-top: 12px;
      color: var(--accent);
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 750;
    }

    details p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.87rem;
      line-height: 1.58;
    }

    .responsibility {
      margin: 4px 0 0;
      color: #f7fbff;
      font-size: 1rem;
      font-weight: 650;
      line-height: 1.45;
    }

    .reflection-question {
      margin: 6px 0 12px;
      color: #fdfcff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.18rem;
      line-height: 1.42;
    }

    textarea,
    input[type="search"],
    select {
      width: 100%;
      border: 1px solid rgba(203, 222, 251, 0.18);
      border-radius: 12px;
      outline: none;
      background: rgba(4, 12, 24, 0.62);
      color: var(--text);
    }

    textarea {
      min-height: 132px;
      margin: 10px 0;
      padding: 12px;
      resize: vertical;
      line-height: 1.5;
    }

    input[type="search"],
    select {
      padding: 12px;
    }

    .legend {
      display: grid;
      gap: 8px;
      margin-top: 15px;
    }

    .legend-item {
      display: grid;
      grid-template-columns: 12px 1fr;
      gap: 9px;
      align-items: start;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      margin-top: 4px;
      border-radius: 50%;
    }

    .astronomy {
      background: #8fc8ff;
    }

    .source-text {
      background: #f4cf7f;
    }

    .tradition {
      background: #9fe0aa;
    }

    .app-interpretation {
      background: #d4a6ff;
    }

    .calendar-toolbar,
    .year-toolbar,
    .library-filters,
    .journal-toolbar,
    .settings-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .calendar-toolbar h3,
    .year-toolbar h3 {
      flex: 1 1 140px;
      margin: 0;
      font-size: 1.03rem;
      text-align: center;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .weekday {
      padding: 4px 0;
      color: var(--faint);
      font-size: 0.67rem;
      font-weight: 750;
      text-align: center;
      text-transform: uppercase;
    }

    .day-cell {
      min-height: 59px;
      padding: 5px 3px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: rgba(3, 13, 25, 0.3);
      text-align: center;
      transition: background 140ms ease, border-color 140ms ease;
    }

    .day-cell:hover {
      border-color: var(--line);
      background: var(--panel-hover);
    }

    .day-cell.blank {
      visibility: hidden;
    }

    .day-cell.today {
      border-color: rgba(239, 200, 117, 0.75);
      box-shadow: inset 0 0 0 1px rgba(239, 200, 117, 0.12);
    }

    .day-cell.selected {
      background: rgba(137, 180, 237, 0.26);
      border-color: rgba(185, 215, 255, 0.9);
    }

    .day-number {
      display: block;
      color: #dde9f8;
      font-size: 0.76rem;
    }

    .day-moon {
      display: block;
      margin-top: 2px;
      font-size: 1.1rem;
      line-height: 1;
    }

    .phase-detail-grid,
    .virtue-grid,
    .month-grid,
    .event-grid,
    .comparison-grid {
      display: grid;
      gap: 11px;
    }

    .phase-info-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.86rem;
    }

    .phase-info-row:last-child {
      border-bottom: 0;
    }

    .phase-info-row span:last-child {
      color: var(--text);
      font-weight: 650;
      text-align: right;
    }

    .month-card {
      padding: 13px;
      text-align: left;
    }

    .month-card h3 {
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .month-events {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .month-event {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .virtue-button {
      display: block;
      width: 100%;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(18, 33, 55, 0.65);
      text-align: left;
      transition: transform 140ms ease, background 140ms ease;
    }

    .virtue-button:hover,
    .virtue-button.selected {
      background: rgba(61, 89, 130, 0.78);
      transform: translateY(-1px);
    }

    .virtue-button h3 {
      margin: 0;
      color: #fff3c9;
      font-size: 1.02rem;
    }

    .virtue-button p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.81rem;
      line-height: 1.4;
    }

    .virtue-detail h3 {
      margin: 0 0 8px;
      color: #fff3c9;
      font-size: 1.28rem;
    }

    .label-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 11px;
    }

    .tag {
      padding: 5px 8px;
      border: 1px solid rgba(201, 221, 250, 0.14);
      border-radius: 999px;
      background: rgba(5, 15, 29, 0.38);
      color: #cddcf0;
      font-size: 0.72rem;
    }

    .library-result {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(14, 28, 47, 0.76);
    }

    .library-result h3 {
      margin: 0;
      color: #fff5cf;
      font-size: 1rem;
    }

    .library-result blockquote {
      margin: 9px 0;
      font-size: 0.95rem;
    }

    .result-topline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
    }

    .relevance {
      padding: 4px 7px;
      border-radius: 999px;
      font-size: 0.67rem;
      font-weight: 780;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .relevance.direct {
      background: rgba(143, 200, 255, 0.18);
      color: #b8deff;
    }

    .relevance.metaphorical {
      background: rgba(244, 207, 127, 0.17);
      color: #f8d98e;
    }

    .relevance.thematic {
      background: rgba(186, 149, 239, 0.18);
      color: #d7b8ff;
    }

    .comparison-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(12, 25, 43, 0.68);
    }

    .comparison-card h3 {
      margin: 0 0 6px;
      color: #fff3c9;
      font-size: 0.96rem;
    }

    .comparison-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.52;
    }

    .journal-entry {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(13, 27, 45, 0.66);
    }

    .journal-entry-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .journal-entry h3 {
      margin: 0;
      font-size: 0.96rem;
    }

    .journal-entry p {
      margin: 7px 0 0;
      color: var(--muted);
      white-space: pre-wrap;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .journal-actions {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }

    .mini-button {
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(54, 78, 111, 0.58);
      color: var(--text);
      font-size: 0.74rem;
    }

    .empty-state {
      padding: 23px 16px;
      border: 1px dashed rgba(207, 225, 255, 0.24);
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    .notice {
      padding: 11px 12px;
      border: 1px solid rgba(143, 200, 255, 0.2);
      border-radius: 12px;
      background: rgba(68, 118, 175, 0.12);
      color: #c8e4ff;
      font-size: 0.8rem;
      line-height: 1.48;
    }

    .warning {
      padding: 11px 12px;
      border: 1px solid rgba(239, 200, 117, 0.3);
      border-radius: 12px;
      background: rgba(113, 83, 24, 0.18);
      color: #ffe7a3;
      font-size: 0.8rem;
      line-height: 1.48;
    }

    .success-note {
      padding: 11px 12px;
      border: 1px solid rgba(158, 224, 178, 0.24);
      border-radius: 12px;
      background: rgba(57, 118, 75, 0.16);
      color: #cef5d8;
      font-size: 0.8rem;
      line-height: 1.48;
    }

    .switch-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .switch-line:last-child {
      border-bottom: 0;
    }

    .switch-line label {
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 650;
    }

    .switch-line p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.4;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #b9d7ff;
    }

    .bottom-nav {
      position: fixed;
      z-index: 30;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      min-height: calc(var(--nav-height) + env(safe-area-inset-bottom));
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(220, 234, 255, 0.14);
      background: rgba(4, 11, 22, 0.93);
      backdrop-filter: blur(18px);
    }

    .nav-button {
      display: grid;
      min-width: 0;
      place-items: center;
      gap: 2px;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      font-size: 0.61rem;
      line-height: 1.1;
    }

    .nav-button .nav-icon {
      font-size: 1.15rem;
    }

    .nav-button.active {
      color: #fff5cc;
      background: rgba(239, 200, 117, 0.11);
    }

    .modal {
      position: fixed;
      z-index: 60;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
    }

    .modal.open {
      display: flex;
    }

    .modal-panel {
      width: min(100%, 700px);
      max-height: min(88vh, 780px);
      overflow: auto;
      padding: 18px;
      border: 1px solid rgba(219, 232, 255, 0.2);
      border-radius: 19px;
      background: linear-gradient(155deg, #1c2d48, #091525);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.58);
    }

      Direct:
        "The passage directly mentions the Moon, seasons, heavens, night, or a related natural cycle.",

    function startOfLocalDay(date) {
      const copy = new Date(date);
      copy.setHours(12, 0, 0, 0);
      return copy;
    }

    function addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return startOfLocalDay(result);
    }

    function daysBetween(a, b) {
      return Math.round((startOfLocalDay(b) - startOfLocalDay(a)) / DAY_MS);
    }

    function formatDate(
      date,
      options = {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      }
    ) {
      return new Intl.DateTimeFormat(undefined, options).format(date);
    }

    function formatShortDate(date) {
      return new Intl.DateTimeFormat(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric"
      }).format(date);
    }

    function formatMonthYear(date) {
      return new Intl.DateTimeFormat(undefined, {
        month: "long",
        year: "numeric"
      }).format(date);
    }

    function dateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function parseDateKey(key) {
      const [year, month, day] = key.split("-").map(Number);
      return new Date(year, month - 1, day, 12);
    }

    function formatDateFromKey(key) {
      return formatDate(parseDateKey(key), {
        weekday: "short",
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }

    function normalizeText(value) {
      return String(value || "").toLowerCase().trim();
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveJSON(key, value) {

    function moonCycleFraction(date) {
      const t = startOfLocalDay(date).getTime();
      const daysSinceEpoch = (t - NEW_MOON_EPOCH) / DAY_MS;
      let fraction = (daysSinceEpoch / SYNODIC_MONTH) % 1;

      if (fraction < 0) {
        fraction += 1;
      }

      return fraction;
    }

    function circularDistance(a, b) {
      const difference = Math.abs(a - b);
      return Math.min(difference, 1 - difference);
    }

    function getMoonData(date) {
      const fraction = moonCycleFraction(date);
      const age = fraction * SYNODIC_MONTH;
      const illumination = ((1 - Math.cos(2 * Math.PI * fraction)) / 2) * 100;

      const phase = phaseDefinitions.reduce((closest, candidate) => {
        return circularDistance(fraction, candidate.center) <
          circularDistance(fraction, closest.center)
          ? candidate
          : closest;
      }, phaseDefinitions[0]);

      return {
        date: startOfLocalDay(date),
        fraction,
        age,
        illumination,
        phase,
        cycleDay: Math.floor(age) + 1
      };
    }

    function getNextOrPreviousMajorPhase(date, direction = 1) {
      const base = startOfLocalDay(date);

      for (let offset = 0; Math.abs(offset) <= 35; offset += direction) {
        const candidate = addDays(base, offset);
        const moon = getMoonData(candidate);
        const distance = circularDistance(moon.fraction, moon.phase.center);
        const isMajor = [
          "new",
          "first-quarter",
          "full",
          "last-quarter"
        ].includes(moon.phase.key);

        if (isMajor && distance < 0.024) {
          return {
            date: candidate,
            phase: moon.phase
          };
        }
      }

      return null;
    }

    function findMajorPhasesInRange(start, end) {
      const events = [];
      let cursor = startOfLocalDay(start);
      let lastKey = "";

      while (cursor <= end) {
        const moon = getMoonData(cursor);
        const isMajor = [
          "new",
          "first-quarter",
          "full",
          "last-quarter"
        ].includes(moon.phase.key);

        const closeToCenter =
          circularDistance(moon.fraction, moon.phase.center) < 0.024;

        if (isMajor && closeToCenter) {
          const eventKey = `${dateKey(cursor)}-${moon.phase.key}`;

          if (eventKey !== lastKey) {
            events.push({
              date: new Date(cursor),
              phase: moon.phase,
              illumination: moon.illumination
            });

            lastKey = eventKey;
          }
        }

        cursor = addDays(cursor, 1);
      }

      return events;
    }

    function seasonBoundaries(year) {
      return {
        marchEquinox: new Date(year, 2, 20, 12),
        juneSolstice: new Date(year, 5, 21, 12),
        septemberEquinox: new Date(year, 8, 22, 12),
        decemberSolstice: new Date(year, 11, 21, 12)
      };
    }

    function getHemisphere() {
      const saved = localStorage.getItem(STORAGE_KEYS.hemisphere);
      return saved === "south" ? "south" : "north";
    }

    function getSeasonData(date, hemisphere = getHemisphere()) {
      const d = startOfLocalDay(date);
      const year = d.getFullYear();
      const boundaries = seasonBoundaries(year);
      const previous = seasonBoundaries(year - 1);
      const next = seasonBoundaries(year + 1);

      let northSeason;

      if (d >= boundaries.marchEquinox && d < boundaries.juneSolstice) {
        northSeason = {
          key: "spring",
          start: boundaries.marchEquinox,
          end: boundaries.juneSolstice
        };
      } else if (
        d >= boundaries.juneSolstice &&
        d < boundaries.septemberEquinox
      ) {
        northSeason = {
          key: "summer",
          start: boundaries.juneSolstice,
          end: boundaries.septemberEquinox
        };
      } else if (
        d >= boundaries.septemberEquinox &&
        d < boundaries.decemberSolstice
      ) {
        northSeason = {
          key: "autumn",
          start: boundaries.septemberEquinox,
          end: boundaries.decemberSolstice
        };
      } else if (d >= boundaries.decemberSolstice) {
        northSeason = {
          key: "winter",
          start: boundaries.decemberSolstice,
          end: next.marchEquinox
        };
      } else {
        northSeason = {
          key: "winter",
          start: previous.decemberSolstice,
          end: boundaries.marchEquinox
        };
      }

      const northIndex = ["spring", "summer", "autumn", "winter"].indexOf(
        northSeason.key
      );

      const seasonIndex =
        hemisphere === "south" ? (northIndex + 2) % 4 : northIndex;

      const season = seasons[seasonIndex];
      const totalDays = Math.max(
        1,
        daysBetween(northSeason.start, northSeason.end)
      );

      const elapsedDays = Math.max(
        0,
        daysBetween(northSeason.start, d)
      );

      const daysRemaining = Math.max(
        0,
        daysBetween(d, northSeason.end)
      );

      return {
        ...season,
        start: northSeason.start,
        end: northSeason.end,
        daysRemaining,
        progress: Math.min(
          100,
          Math.max(0, (elapsedDays / totalDays) * 100)
        ),
        hemisphere,
        approximation: true
      };
    }

    function chooseDailyTheme(phase, season, date) {
      const phaseTheme = phase.theme;
      const seasonalThemes = season.themes;

      const seed = Math.abs(
        Math.floor(date.getTime() / DAY_MS + phase.center * 1000)
      );

      const seasonalTheme =
        seasonalThemes[seed % seasonalThemes.length];

      const compatibleThemes = {
        Beginning: ["Beginning", "Planting", "Preparation", "Learning"],
        Growth: ["Growth", "Learning", "Development", "Hope"],
        Action: ["Action", "Work", "Courage", "Service"],
        Refinement: ["Discipline", "Temperance", "Preparation", "Evaluation"],
        Clarity: ["Evaluation", "Reflection", "Wisdom", "Gratitude"],
        Generosity: ["Sharing", "Service", "Abundance", "Stewardship"],
        Correction: ["Consequences", "Evaluation", "Stewardship", "Preparation"],
        Release: ["Reflection", "Simplification", "Rest", "Preparation"]
      };

      const compatible = compatibleThemes[phaseTheme] || [];

      const seasonalMatch = compatible.some(
        item => normalizeText(item) === normalizeText(seasonalTheme)
      );

      return seasonalMatch ? seasonalTheme : phaseTheme;
    }

    function buildSeasonalResponsibility(season, phase, theme) {
      const responsibilityBySeason = {
        Spring:
          "Begin with care: prepare what you want to grow, and make room for learning.",
        Summer:
          "Express capacity through disciplined work, useful service, and sustained attention.",
        Autumn:
          "Examine what your actions have produced; practice gratitude, stewardship, and honest evaluation.",
        Winter:
          "Protect what matters; simplify, rest, reflect, and prepare without hurry."
      };

      return (
        responsibilityBySeason[season.name] +
        ` Today’s lunar emphasis is ${normalizeText(
          phase.theme
        )}; use it as a modern prompt for ${normalizeText(theme)}.`
      );
    }

    function getDaysAgo(dateString) {
      const target = new Date(`${dateString}T12:00:00`);
      const today = startOfLocalDay(new Date());
      return Math.floor((today - target) / DAY_MS);
    }

    function seededNumber(seedText) {
      let hash = 2166136261;

      for (let i = 0; i < seedText.length; i++) {
        hash ^= seedText.charCodeAt(i);
        hash +=
          (hash << 1) +
          (hash << 4) +
          (hash << 7) +
          (hash << 8) +
          (hash << 24);
      }

      return Math.abs(hash >>> 0) / 4294967295;
    }

    function normalizedReference(source) {
      return `${source.work} ${source.reference}`.toLowerCase();
    }

    function getHistoryWithinDays(history, days, relativeDate = new Date()) {
      const anchor = startOfLocalDay(relativeDate);

      return history.filter(entry => {
        const entryDate = new Date(`${entry.date}T12:00:00`);
        const age = Math.floor((anchor - entryDate) / DAY_MS);
        return age >= 0 && age < days;
      });
    }

    function countTraditionAppearances(history, tradition, days, relativeDate) {
      return getHistoryWithinDays(history, days, relativeDate).filter(
        entry => entry.tradition === tradition
      ).length;
    }

    function hasRecentPassage(history, sourceId, days, relativeDate) {
      return getHistoryWithinDays(history, days, relativeDate).some(
        entry => entry.sourceId === sourceId
      );
    }

    function hasRecentReference(history, source, days, relativeDate) {
      const targetReference = normalizedReference(source);

      return getHistoryWithinDays(history, days, relativeDate).some(
        entry => entry.referenceKey === targetReference
      );
    }

    function hasRecentTradition(history, tradition, days, relativeDate) {
      return getHistoryWithinDays(history, days, relativeDate).some(
        entry => entry.tradition === tradition
      );
    }

    function getEligibleWisdomSources(settings = state.diversitySettings) {
      return wisdomSources.filter(source => {
        const isNiv =
          source.translation === "New International Version (NIV)";

        if (isNiv && !settings.allowNiv) {
          return false;
        }

        if (settings.excludedTraditions.includes(source.tradition)) {
          return false;
        }

        return true;
      });
    }

    function calculatePassageScore(source, context, history, settings) {
      const { moon, season, virtue, theme, date } = context;
      let score = 0;

      const phaseKeywords = [
        moon.phase.theme,
        theme,
        season.responsibility,
        ...season.themes
      ].map(normalizeText);

      if (source.virtues.includes(virtue)) {
        score += 18;
      }

      if (
        source.themes.some(
          sourceTheme =>
            normalizeText(sourceTheme) === normalizeText(theme)
        )
      ) {
        score += 15;
      }

      if (
        source.themes.some(sourceTheme =>
          phaseKeywords.includes(normalizeText(sourceTheme))
        )
      ) {
        score += 7;
      }

      if (
        source.relevance === "Direct" &&
        ["new", "full", "first-quarter", "last-quarter"].includes(
          moon.phase.key
        )
      ) {
        score += 4;
      }

      if (
        settings.preferredTraditions.length &&
        settings.preferredTraditions.includes(source.tradition)
      ) {
        score += 5;
      }

      if (
        hasRecentPassage(
          history,
          source.id,
          settings.passageCooldownDays,
          date
        )
      ) {
        score -= 100;
      }

      if (
        hasRecentReference(
          history,
          source,
          settings.referenceCooldownDays,
          date
        )
      ) {
        score -= 35;
      }

      if (
        hasRecentTradition(
          history,
          source.tradition,
          settings.traditionCooldownDays,
          date
        )
      ) {
        score -= 16;
      }

      const traditionAppearances = countTraditionAppearances(
        history,
        source.tradition,
        30,
        date
      );

      if (
        traditionAppearances >=
        settings.maxSameTraditionIn30Days
      ) {
        score -= 25;
      } else {
        score -= traditionAppearances * 3;
      }

      const isNiv =
        source.translation === "New International Version (NIV)";

      const recentNiv = getHistoryWithinDays(history, 14, date).filter(
        entry => entry.translation === "New International Version (NIV)"
      ).length;

      const recentKjv = getHistoryWithinDays(history, 14, date).filter(
        entry => entry.translation.includes("King James Version")
      ).length;

      if (
        settings.translationPreference === "balanced" &&
        isNiv &&
        recentNiv > recentKjv
      ) {
        score -= 5;
      }

      if (
        settings.translationPreference === "kjv-preferred" &&
        isNiv
      ) {
        score -= 10;
      }

      if (
        settings.translationPreference === "niv-preferred" &&
        source.translation.includes("King James Version")
      ) {
        score -= 5;
      }

      const dailyVariation = seededNumber(`${dateKey(date)}-${source.id}`);
      score += dailyVariation * 1.5;

      return score;
    }

    function selectDiversePassage(context, excludedSourceIds = []) {
      const settings = state.diversitySettings;
      const history = loadWisdomHistory();

      const availableSources = getEligibleWisdomSources(settings).filter(
        source => !excludedSourceIds.includes(source.id)
      );

      const ranked = availableSources
        .map(source => ({
          source,
          score: calculatePassageScore(
            source,
            context,
            history,
            settings
          )
        }))
        .sort((a, b) => b.score - a.score);

      return ranked.length ? ranked[0].source : wisdomSources[0];
    }

    function getSavedDailyPassage(date) {
      const selections = getStoredDailySelections();
      const selectedId = selections[dateKey(date)];

      if (!selectedId) {
        return null;
      }

      return wisdomSources.find(source => source.id === selectedId) || null;
    }

    function saveDailyPassageSelection(date, source) {
      const selections = getStoredDailySelections();
      const key = dateKey(date);

      selections[key] = source.id;
      saveStoredDailySelections(selections);

      const history = loadWisdomHistory();
      const existingIndex = history.findIndex(entry => entry.date === key);

      const record = {
        date: key,
        sourceId: source.id,
        tradition: source.tradition,
        translation: source.translation,
        referenceKey: normalizedReference(source)
      };

      if (existingIndex >= 0) {
        history[existingIndex] = record;
      } else {
        history.push(record);
      }

      const compactHistory = history
        .sort((a, b) => a.date.localeCompare(b.date))
        .slice(-365);

      saveWisdomHistory(compactHistory);
    }

    function chooseDailyPassage(context) {
      const existing = getSavedDailyPassage(context.date);

      if (existing) {
        return existing;
      }

      const selected = selectDiversePassage(context);
      saveDailyPassageSelection(context.date, selected);

      return selected;
    }

    function chooseAlternativeDailyPassage(context) {
      const current = getSavedDailyPassage(context.date);
      const alternative = selectDiversePassage(
        context,
        current ? [current.id] : []
      );

      saveDailyPassageSelection(context.date, alternative);
      return alternative;
    }

    function getDiversityReason(source, context) {
      const history = loadWisdomHistory();
      const settings = state.diversitySettings;
      const reasons = [];

      if (source.virtues.includes(context.virtue)) {
        reasons.push(`it supports today’s virtue of ${context.virtue}`);
      }

      if (
        source.themes.some(
          theme => normalizeText(theme) === normalizeText(context.theme)
        )
      ) {
        reasons.push(`it directly matches today’s theme of ${context.theme}`);
      }

      if (
        !hasRecentTradition(
          history,
          source.tradition,
          settings.traditionCooldownDays,
          context.date
        )
      ) {
        reasons.push(`${source.tradition} has not appeared in the recent tradition cooldown window`);
      }

      if (
        !hasRecentPassage(
          history,
          source.id,
          settings.passageCooldownDays,
          context.date
        )
      ) {
        reasons.push(`this exact passage has not appeared in the recent ${settings.passageCooldownDays}-day passage cooldown window`);
      }

      if (
        source.translation === "New International Version (NIV)" &&
        settings.translationPreference === "balanced"
      ) {
        reasons.push("the app is balancing its limited NIV layer with other translations");
      }

      if (source.translation.includes("King James Version")) {
        reasons.push("the KJV source is part of the app’s local historical-text layer");
      }

      return reasons;
    }

    function getDailyContext(date) {
      const selected = startOfLocalDay(date);
      const moon = getMoonData(selected);
      const season = getSeasonData(selected);

      const phaseVirtue = moon.phase.virtue;

      const virtue = phaseVirtue.includes("/")
        ? moon.phase.key === "waning-crescent"
          ? "Wisdom"
          : "Temperance"
        : phaseVirtue;

      const theme = chooseDailyTheme(moon.phase, season, selected);

      const baseContext = {
        date: selected,
        moon,
        season,
        virtue,
        theme
      };

      const passage = chooseDailyPassage(baseContext);

      return {
        ...baseContext,
        passage,
        responsibility: buildSeasonalResponsibility(
          season,
          moon.phase,
          theme
        )
      };
    }

    function sourceMatchesQuery(source, query) {
      if (!query) {
        return true;
      }

      const haystack = [
        source.tradition,
        source.work,
        source.reference,
        source.translation,
        source.quote,
        source.relevance,
        ...source.themes,
        ...source.virtues,
        ...source.keywords
      ]
        .join(" ")
        .toLowerCase();

      return haystack.includes(query);
    }

    function validateCopyrightedBibleUse(sources = wisdomSources) {
      const nivSources = sources.filter(
        source => source.translation === "New International Version (NIV)"
      );

      const nivVerseTotal = nivSources.reduce(
        (total, source) => total + Number(source.verseCount || 0),
        0
      );

      return {
        nivSourceCount: nivSources.length,
        nivVerseTotal,
        withinBasicNivVerseLimit: nivVerseTotal <= 500,
        warning:
          nivVerseTotal > 450
            ? "Approaching the NIV 500-verse quotation threshold. Review rights and permissions before adding more NIV text."
            : null
      };
    }

    function getMultiTraditionComparison(context) {
      const desiredTraditions = [
        "Buddhist",
        "Hindu / Indian",
        "Taoist",
        "Hebrew Bible / Old Testament",
        "Islamic",
        "Stoic"
      ];

      const eligible = getEligibleWisdomSources();

      const matches = [];

      desiredTraditions.forEach(tradition => {
        const candidates = eligible
          .filter(source => source.tradition === tradition)
          .map(source => {
            let score = 0;

            if (source.virtues.includes(context.virtue)) {
              score += 5;
            }

            if (
              source.themes.some(
                theme =>
                  normalizeText(theme) === normalizeText(context.theme)
              )
            ) {
              score += 4;
            }

            if (
              source.keywords.some(
                keyword =>
                  normalizeText(keyword) === normalizeText(context.theme)
              )
            ) {
              score += 2;
            }

            return {
              source,
              score
            };
          })
          .sort((a, b) => b.score - a.score);

        if (candidates.length) {
          matches.push(candidates[0].source);
        }
      });

      return matches;
    }

          <p class="eyebrow">Bible translations</p>

          <p class="small">
            <strong>King James Version:</strong>

          <p class="small" style="margin-top:12px">
            <strong>New International Version:</strong>
            NIV quotations in this app are deliberately limited, short,

            ${nivUsage.nivVerseTotal} NIV verse${
              nivUsage.nivVerseTotal === 1 ? "" : "s"
            } out of a basic 500-verse guardrail.
          </p>

          <p class="small" style="margin-top:12px">

    }

    function showToast(message) {
      const existing = document.getElementById("toast");

      if (existing) {
        existing.remove();
      }

      const toast = document.createElement("div");

      toast.id = "toast";
      toast.textContent = message;

      toast.style.cssText = `
        position: fixed;
        z-index: 90;
        left: 50%;
        bottom: calc(var(--nav-height) + 17px);
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 32px);
        padding: 10px 14px;
        border: 1px solid rgba(158,224,178,.35);
        border-radius: 999px;
        background: rgba(14,48,35,.96);
        color: #e2ffeb;
        box-shadow: 0 10px 28px rgba(0,0,0,.35);
        font-size: .84rem;
        font-weight: 700;
      `;

      document.body.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 2400);
    }

    function switchScreen(screenName) {
      state.activeScreen = screenName;

      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.toggle(
          "active",
          screen.id === `screen-${screenName}`
        );
      });

      document.querySelectorAll("[data-screen-target]").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.screenTarget === screenName
        );
      });

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function renderAll() {
      renderToday();
      renderMoon();
      renderSeasons();
      renderVirtues();
      renderWisdom();
      renderJournal();

      switchScreen(state.activeScreen);
    }

    async function generateWisdomAdvice(question, context) {
      return {
        mode: "local-deterministic",
        question,
        context,
        advice:
          context?.moon?.phase?.action ||
          "Choose one small action aligned with your stated value."
      };
    }

    function attachGlobalEvents() {
      document.querySelectorAll("[data-screen-target]").forEach(button => {
        button.addEventListener("click", () => {
          switchScreen(button.dataset.screenTarget);
        });
      });

      document
        .getElementById("legendButton")
        .addEventListener("click", renderLegend);

      document
        .getElementById("closeModal")
        .addEventListener("click", closeModal);

      document.getElementById("appModal").addEventListener("click", event => {
        if (event.target.id === "appModal") {
          closeModal();
        }
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          closeModal();
        }
      });
    }

    attachGlobalEvents();
    renderAll();

    window.LunarWisdom = {
      APP_VERSION,
      getMoonData,
      getSeasonData,
      getDailyContext,
      chooseDailyPassage,
      chooseAlternativeDailyPassage,
      validateCopyrightedBibleUse,
      generateWisdomAdvice,
      wisdomSources,
      virtues,
      seasons,
      phaseDefinitions,
      NIV_COPYRIGHT_NOTICE
    };
  </script>
</body>
